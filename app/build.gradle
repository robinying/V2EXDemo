apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
// 本地存在签名配置时才启用，避免无密钥环境下配置失败
def hasSigningConfig = localProps.getProperty('STORE_FILE') != null

android {
    namespace 'com.robin.v2exdemo'
    compileSdk 36

    defaultConfig {
        applicationId "com.robin.v2exdemo"
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        dataBinding true
        buildConfig true
    }

    signingConfigs {
        app {
            if (hasSigningConfig) {
                storeFile rootProject.file(localProps.getProperty('STORE_FILE'))
                storePassword localProps.getProperty('STORE_PASSWORD')
                keyAlias localProps.getProperty('KEY_ALIAS')
                keyPassword localProps.getProperty('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            zipAlignEnabled false
            if (hasSigningConfig) {
                signingConfig signingConfigs.app
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        release {
            minifyEnabled true//开启混淆
            shrinkResources true
            zipAlignEnabled true//去除无用资源
            if (hasSigningConfig) {
                signingConfig signingConfigs.app
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    lint {
        disable 'InvalidPackage'
        disable "ResourceType"
        // DoraemonKit(仅 debug 依赖) 内部会发通知，应用自身不使用通知权限
        disable 'NotificationPermission'
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    implementation 'androidx.multidex:multidex:2.0.1'
    //androidx UI
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.preference:preference:1.2.1'
    //dialog
    implementation "com.afollestad.material-dialogs:lifecycle:3.3.0"
    implementation "com.afollestad.material-dialogs:core:3.3.0"
    implementation "com.afollestad.material-dialogs:color:3.3.0"
    implementation "com.afollestad.material-dialogs:datetime:3.3.0"
    implementation "com.afollestad.material-dialogs:bottomsheets:3.3.0"
    //util
    implementation 'com.blankj:utilcodex:1.31.1'
    //微信开源项目，替代SP
    implementation 'com.tencent:mmkv:1.3.17'
    //BaseAdapter
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:3.0.4'
    //第三方recyclerview
    implementation 'com.yanzhenjie.recyclerview:x:1.3.2'
    //管理界面状态库
    implementation 'com.kingja.loadsir:loadsir:1.3.6'
    //加载webview
    implementation 'com.just.agentweb:agentweb-androidx:4.1.4'
    implementation 'com.just.agentweb:filechooser-androidx:4.1.4'
    implementation 'com.download.library:Downloader:4.1.4'
    //Bugly
    implementation 'com.tencent.bugly:crashreport_upgrade:1.6.1'
    implementation 'com.tencent.bugly:nativecrashreport:3.9.2'
    //glide
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    //屏幕适配
    implementation 'me.jessyan:autosize:1.2.1'
    //防崩溃
    implementation 'cat.ereza:customactivityoncrash:2.4.0'
    //下载
    implementation("com.liulishuo.filedownloader:library:1.7.7") {
        exclude group: "com.android.support"
    }
    //doraemonkit
    debugImplementation 'com.didichuxing.doraemonkit:doraemonkit:3.2.0'
    releaseImplementation 'com.didichuxing.doraemonkit:doraemonkit-no-op:3.2.0'
    //lottie
    implementation 'com.airbnb.android:lottie:6.7.1'
    //高德
//    implementation 'com.amap.api:3dmap:7.5.0'
//    //implementation 'com.amap.api:map2d:latest.integration'
//    implementation 'com.amap.api:location:5.1.0'
//    implementation 'com.amap.api:search:7.4.0'
    //Refresh
    implementation 'io.github.scwang90:refresh-layout-kernel:2.1.1'
    implementation 'io.github.scwang90:refresh-header-classics:2.1.1'
    implementation 'io.github.scwang90:refresh-header-radar:2.1.1'
    //popup
    implementation 'com.github.razerdp:BasePopup:2.2.7'
    //项目框架
    implementation project(path: ':lib_base')

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

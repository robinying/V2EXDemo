apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
android {
    namespace 'me.hgj.jetpackmvvm'
    compileSdk 36
    defaultConfig {
        minSdk 21
        versionCode 17
        versionName "1.1.7"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
    }
    buildFeatures{
        dataBinding = true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    //kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.17.0'
    //lifecycle
    api 'androidx.lifecycle:lifecycle-runtime:2.9.4'
            // viewModel
    api "androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4"
    api "androidx.fragment:fragment-ktx:1.8.9"
    // liveData
    api "androidx.lifecycle:lifecycle-livedata-ktx:2.9.4"
    //navigation
    api 'androidx.navigation:navigation-runtime:2.8.9'
    api 'androidx.navigation:navigation-fragment:2.8.9'
    //retrofit
    api "com.squareup.retrofit2:retrofit:2.9.0"
    api "com.squareup.retrofit2:converter-gson:2.9.0"
    api 'com.github.franmontiel:PersistentCookieJar:v1.0.1'
    //动态替换BaseUrl库 使用可参考 https://github.com/JessYanCoding/RetrofitUrlManager
    api 'me.jessyan:retrofit-url-manager:1.4.0'

}
